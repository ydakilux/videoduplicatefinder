name: Windows 64-bit

on: [pull_request]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'
    - name: Build GUI
      run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build CLI
      run: dotnet publish VDF.CLI/VDF.CLI.csproj -c Release -v q --self-contained -r win-x64
    - name: Build Web
      run: dotnet publish VDF.Web/VDF.Web.csproj -c Release -v q --self-contained -r win-x64
    - name: Run Unit Tests
      run: dotnet test VDF.Core.Tests/VDF.Core.Tests.csproj -c Release -v q
    - name: Run CLI Tests
      run: dotnet test VDF.CLI.Tests/VDF.CLI.Tests.csproj -c Release -v q
    - name: Run GUI Tests
      run: dotnet test VDF.GUI.Tests/VDF.GUI.Tests.csproj -c Release -v q
    - name: Run GUI Headless Tests
      run: dotnet test VDF.GUI.HeadlessTests/VDF.GUI.HeadlessTests.csproj -c Release -v q
    - name: Run Web Tests
      run: dotnet test VDF.Web.Tests/VDF.Web.Tests.csproj -c Release -v q
    - name: Install FFmpeg
      run: choco install ffmpeg -y --no-progress
    - name: Run Integration Tests
      run: dotnet test VDF.IntegrationTests/VDF.IntegrationTests.csproj -c Release -v normal

  mcp-native-aot:
    name: MCP Native AOT (Linux x64)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0.x'
    - name: Install Linux Native AOT toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev
    - name: Publish CLI with Native AOT
      run: dotnet publish VDF.CLI/VDF.CLI.csproj -c Release -r linux-x64 -p:PublishAot=true -o "$RUNNER_TEMP/vdf-cli-aot"
    - name: Smoke-test published MCP server over stdio
      run: python3 .github/scripts/smoke_mcp.py "$RUNNER_TEMP/vdf-cli-aot/vdf-cli"
    - name: Publish GUI with Native AOT (includes IPC serializers)
      run: dotnet publish VDF.GUI/VDF.GUI.csproj -c Release -r linux-x64 -p:PublishAot=true -o "$RUNNER_TEMP/vdf-gui-aot"
